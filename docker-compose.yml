# Two-service stack: `db` (official Postgres with PostGIS built on top,
# via `Dockerfile.postgis`) and `app` (this repo, via `Dockerfile`).
#
# Usage: `./bootstrap.py system` — that generates `.env`, brings `db`
# up, applies migrations, refreshes `.sqlx/` and then builds/starts
# `app`. `docker compose up --build` (or `podman-compose up --build`)
# works too, but only against an already-migrated `.sqlx/` cache.
# See `bootstrap.md`.
#
# Every value below is interpolated from `.env` in this directory, which
# compose auto-loads (and which `./bootstrap.py env` generates). Note
# that `app`'s DATABASE_URL is deliberately *not* `.env`'s DATABASE_URL:
# that one names the host-published port for host-side `sqlx`/`cargo
# run`, whereas a container reaches Postgres as `db:5432` on the compose
# network. Both are built from the same DB_USER/DB_PWD/DB_NAME, so
# there's still a single set of credentials. They're dev-only
# placeholders — swap them for real secrets management before deploying
# anywhere reachable.

services:
  db:
    # Official Postgres + PostGIS built on top, so one image covers
    # amd64 and arm64 — see `Dockerfile.postgis`.
    build:
      context: .
      dockerfile: Dockerfile.postgis
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Postgres 18 moved PGDATA to `/var/lib/postgresql/18/docker` and
      # the volume one level up, to `/var/lib/postgresql` — a `pgdata`
      # volume from an older Postgres image can't be reused here.
      - pgdata:/var/lib/postgresql
    # Published so host-side tooling (`sqlx migrate run`, `cargo sqlx
    # prepare`, `psql`) can reach it on DB_PORT; `app` uses the compose
    # network regardless.
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PWD}@db:5432/${DB_NAME}
      # Fixed, not from `.env`: the port publish below targets 3000
      # inside the container. `.env`'s BIND_ADDR is for host `cargo run`.
      BIND_ADDR: 0.0.0.0:3000
      SECURE_COOKIES: ${SECURE_COOKIES}
      RUST_LOG: ${RUST_LOG}
    # Nothing terminates TLS in front of the app in this stack, so it's
    # published directly. Put it behind a TLS-terminating reverse proxy
    # before exposing it publicly, and set SECURE_COOKIES=true in `.env`
    # once you do — otherwise the session cookie's `Secure` flag makes
    # login silently fail over plain HTTP.
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
