# The deployable stack: `db` (Postgres + PostGIS) and `app` (this repo,
# via `Dockerfile`).
#
# Usage: `./bootstrap.py env` (writes `.env` with generated secrets),
# then `./bootstrap.py up` — or `docker compose up -d --build` (podman
# compose works too). See `bootstrap.md`.
#
# Every value below is interpolated from `.env` in this directory, which
# compose auto-loads. `app`'s DATABASE_URL is deliberately *not* `.env`'s
# DATABASE_URL: that one names the host-published port for host-side
# `dx serve`/`cargo sqlx`, whereas a container reaches Postgres as
# `db:5432` on the compose network. Both are built from the same
# DB_USER/DB_PWD/DB_NAME.

services:
  db:
    image: docker.io/postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?run ./bootstrap.py env}
      POSTGRES_PASSWORD: ${DB_PWD:?run ./bootstrap.py env}
      POSTGRES_DB: ${DB_NAME:?run ./bootstrap.py env}
    volumes:
      # Postgres 18 moved PGDATA to `/var/lib/postgresql/18/docker` and
      # the volume one level up, to `/var/lib/postgresql` — a `pgdata`
      # volume from an older Postgres image can't be reused here.
      - pgdata:/var/lib/postgresql
    # Loopback only: host-side tooling (`dx serve`, `cargo sqlx prepare`,
    # `psql`) reaches it on DB_PORT, the outside world doesn't. `app`
    # uses the compose network regardless.
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bauernkarte:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PWD}@db:5432/${DB_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run ./bootstrap.py env}
      # Plain HTTP, so `false`: a `Secure` session cookie over HTTP makes
      # login silently fail.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports:
      - "${APP_PORT:-3000}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
