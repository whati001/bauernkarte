[package]
name = "bauernkarte"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
askama = "0.16.0"
axum = { version = "0.8.9", features = ["multipart"] }
dotenvy = "0.15.7"
fluent-templates = "0.15.1"
futures-util = "0.3.34"
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
rand = "0.10.2"
rust_decimal = { version = "1.42.1", features = ["serde"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "time", "uuid", "json", "migrate", "rust_decimal"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "limit"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = { version = "0.9.6", features = ["macros"] }
