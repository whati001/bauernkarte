[package]
name = "bauernkarte"
version = "0.2.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
# The official component library, pinned to the commit the files in
# `src/ui/` were copied from.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a75825" }
dioxus-icons = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fluent-templates = "0.15.1"
unic-langid = { version = "0.9.6", features = ["macros"] }
time = { version = "0.3.55", features = ["serde", "formatting", "macros", "wasm-bindgen"] }

# Server-only. Everything that touches Postgres, sessions, hashing or
# image decoding stays out of the WASM bundle.
anyhow = { version = "1.0.104", optional = true }
argon2 = { version = "0.5.3", optional = true }
governor = { version = "0.10.4", optional = true }
axum = { version = "0.8.9", features = ["multipart"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "json", "migrate", "macros"], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.0", features = ["fs", "trace", "limit"], optional = true }
tower-sessions = { version = "0.14", optional = true }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"], optional = true }
tracing = { version = "0.1.44", optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "dioxus-primitives/web"]
server = [
    "dioxus/server",
    "dep:anyhow",
    "dep:argon2",
    "dep:governor",
    "dep:axum",
    "dep:dotenvy",
    "dep:image",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:tracing",
]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
