<!-- Header image. A visitor-uploaded photo when the store has one;
     otherwise the drawn fallback below.

     The fallback is a hand-authored SVG scene (sky, sun, hills, barn,
     field) rather than a stock photo, tinted from `--hero-hue` — which
     comes from the store's *lead product's* id (see HeroArt in
     store_detail.rs). So the illustration is per product, not per store:
     every shop leading with apples gets the same picture, which is the
     point. The store's product emoji ride in the crate in front. -->
{% if let Some(image_id) = hero_image_id %}
<div class="store-hero">
  <img src="/image/{{ image_id }}" alt="{{ store_name }}" loading="lazy">
</div>
{% else %}
<div class="store-hero store-hero-art" style="--hero-hue: {{ hero_art.hue }}" role="img" aria-label="{{ "detail-hero-art-alt"|t }}">
  <svg viewBox="0 0 400 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1">
        <!-- Sky is fixed: only the land takes the per-product hue, or
             the scene stops reading as a farm. -->
        <stop offset="0%" stop-color="hsl(199 72% 82%)" />
        <stop offset="100%" stop-color="hsl(186 62% 93%)" />
      </linearGradient>
      <linearGradient id="hero-field" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(calc(var(--hero-hue) * 1deg) 40% 52%)" />
        <stop offset="100%" stop-color="hsl(calc(var(--hero-hue) * 1deg) 44% 38%)" />
      </linearGradient>
    </defs>

    <rect width="400" height="170" fill="url(#hero-sky)" />
    <circle cx="330" cy="38" r="20" fill="hsl(46 92% 74%)" opacity="0.9" />

    <!-- Rolling hills, back to front -->
    <path d="M0 96 Q 70 66 140 90 T 280 84 T 400 92 L400 170 L0 170 Z"
          fill="hsl(calc(var(--hero-hue) * 1deg) 32% 68%)" opacity="0.8" />
    <path d="M0 112 Q 90 88 180 108 T 400 104 L400 170 L0 170 Z"
          fill="hsl(calc(var(--hero-hue) * 1deg) 36% 56%)" opacity="0.9" />

    <!-- Barn -->
    <g transform="translate(48 62)">
      <path d="M0 20 L26 4 L52 20 L52 54 L0 54 Z" fill="hsl(12 46% 52%)" />
      <path d="M-4 21 L26 2 L56 21 L52 25 L26 8 L0 25 Z" fill="hsl(12 40% 38%)" />
      <rect x="18" y="30" width="16" height="24" rx="1.5" fill="hsl(30 30% 88%)" />
      <path d="M18 30 L34 54 M34 30 L18 54" stroke="hsl(12 40% 38%)" stroke-width="2" />
    </g>

    <!-- Field with furrows -->
    <path d="M0 118 Q 200 106 400 118 L400 170 L0 170 Z" fill="url(#hero-field)" />
    <g stroke="hsl(calc(var(--hero-hue) * 1deg) 40% 38%)" stroke-width="1.5" opacity="0.35">
      <path d="M-10 132 Q 200 122 410 132" fill="none" />
      <path d="M-10 146 Q 200 136 410 146" fill="none" />
      <path d="M-10 160 Q 200 150 410 160" fill="none" />
    </g>

    <!-- Fence -->
    <g stroke="hsl(34 34% 82%)" stroke-width="3" stroke-linecap="round">
      <path d="M300 122 L300 146 M330 120 L330 144 M360 118 L360 142 M390 116 L390 140" />
      <path d="M296 128 Q 345 124 394 122" fill="none" stroke-width="2.5" />
    </g>

    <!-- Produce crate -->
    <g transform="translate(120 112)">
      <path d="M0 14 L124 14 L114 46 L10 46 Z" fill="hsl(34 44% 66%)" />
      <path d="M0 14 L124 14 L122 21 L2 21 Z" fill="hsl(34 40% 56%)" />
      <path d="M18 22 L16 46 M44 22 L43 46 M80 22 L81 46 M106 22 L108 46"
            stroke="hsl(34 36% 50%)" stroke-width="2" opacity="0.6" />
    </g>
  </svg>
  <div class="store-hero-produce" aria-hidden="true">
    {% for icon in hero_art.icons %}<span>{{ icon }}</span>{% endfor %}
  </div>
</div>
{% endif %}
