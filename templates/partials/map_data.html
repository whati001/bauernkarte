<div id="map-data" style="display:none" aria-hidden="true">
  <script type="application/json" id="map-stores-json">{{ map_stores_json|safe }}</script>
  <!-- One invisible, clickable trigger per matching store — map.js
       proxy-clicks
       these to open a store's detail from a pin, regardless of which
       panel #sidebar currently shows (this container lives outside it —
       see layout.html's comment on why that matters). -->
  <div id="map-store-triggers">
    {% for s in map_stores %}
    <button type="button" tabindex="-1" data-store-id="{{ s.id }}" data-on:click="@get('/api/store/{{ s.id }}')"></button>
    {% endfor %}
  </div>
</div>
