<!-- Patched by GET /api/search/suggest (morph by id). Visibility is a
     signal, not `:empty`, so the "no matches" line below can be shown at
     all — and so the dropdown closes without a round trip on Escape /
     click-outside (see navbar.html). -->
<div id="nav-suggestions" class="nav-suggestions" data-show="$navOpen" role="listbox" aria-label="{{ "nav-search-label"|t }}">
  {% for s in suggestions %}
  <button type="button" class="nav-suggestion" role="option" aria-selected="false"
          data-on:click="$navSearchOpen = false; @get('/api/search/select/{{ s.kind }}/{{ s.id }}')">
    <span class="nav-suggestion-icon" aria-hidden="true">{{ s.icon }}</span>
    <span class="nav-suggestion-name">{{ s.name }}</span>
    <span class="nav-suggestion-kind">{{ s.kind_label }}</span>
  </button>
  {% endfor %}
  {% if suggestions.is_empty() && searched %}
  <p class="nav-suggestion-empty">{{ "nav-search-no-matches"|t }}</p>
  {% endif %}
</div>
