<select id="product-select" data-bind:product-id data-on:change="@get('/api/stores')">
  <option value="">{{ "search-all"|t }}</option>
  {% for p in products %}
  <option value="{{ p.id }}">{% if let Some(icon) = p.icon %}{{ icon }}{% else %}📦{% endif %} {{ p.name }}</option>
  {% endfor %}
</select>
