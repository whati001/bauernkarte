<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/datastar.js"></script>
</head>
<body data-signals='{{ signals_json|safe }}'>
  <!-- Hidden data-bind targets map.js writes into (via .value + dispatchEvent("input"))
       after resolving geolocation — the only bridge from imperative JS into the
       Datastar signal store this app needs; everything else is declarative. -->
  <input type="hidden" id="lat-input" data-bind:lat>
  <input type="hidden" id="lon-input" data-bind:lon>

  {{ navbar_html|safe }}

  <!-- Map-first: the landing page renders with the panel already
       collapsed (`GET /` passes `sidebar_collapsed`), so the first thing
       a visitor sees is the map. A `/store/{id}` deep link renders it
       open, since the whole point of that URL is the store info. From
       there map.js drives the open/closed state off whichever panel
       #sidebar holds — see `syncSidebarLifecycle`. -->
  <div id="layout"{% if sidebar_collapsed %} class="sidebar-collapsed"{% endif %}>
    <div id="sidebar">{{ sidebar_html|safe }}</div>
    <!-- Lives outside #sidebar on purpose — see map_data.html's own doc
         comment (handlers::search::MapDataTemplate) for why: nested
         inside the swappable sidebar content, the map's pins and
         click-triggers used to vanish the moment #sidebar showed
         anything other than the search panel. -->
    {{ map_data_html|safe }}
    <!-- The panel's only manual control, and the sole reason it lives
         out here rather than in `#sidebar`: it has to survive every
         panel swap (search/detail/forms) and stay reachable while the
         panel is closed. Wired once in map.js rather than re-wired per
         panel like the distance slider/location picker. Rides the map's
         top-left corner and toggles; its label flips client-side (see
         setSidebarCollapsed). -->
    <button id="sidebar-open" type="button" aria-label="{{ "map-sidebar-expand"|t }}" title="{{ "map-sidebar-expand"|t }}" data-collapse-label="{{ "map-sidebar-collapse"|t }}" data-expand-label="{{ "map-sidebar-expand"|t }}">{% include "icons/layers.svg" %}</button>
    <div id="map"></div>
  </div>

  <script src="/static/leaflet/leaflet.js"></script>
  <script type="module" src="/static/map.js"></script>
</body>
</html>
