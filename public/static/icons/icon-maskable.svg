<!-- App icon, "maskable" purpose (and the iOS home-screen icon, which is
     masked the same way). Full-bleed background with no corner rounding of
     its own: the launcher applies whatever shape it wants (circle,
     squircle, rounded square) and anything outside that shape is cut off.
     The sprout is drawn at 50% of the canvas so it stays inside the safe
     zone the spec guarantees (the centre circle of 80% diameter), which is
     why it looks smaller here than in icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#f5efe4" />
  <g transform="translate(128 128) scale(10.6667)"
     fill="none" stroke="#008300" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" />
    <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" />
    <path d="M5 21h14" />
  </g>
</svg>
